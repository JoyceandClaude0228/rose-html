<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>贝贝的钻戒</title>
<link rel="apple-touch-icon" href="ring-icon.PNG">
<style>
/* Layout: full-bleed stage. The proposal line sits at the top, the ring turns in the middle, metal choices sit at the bottom. */
:root{
  --bg-0:#090a11;
  --bg-1:#2c2331;
  --fg:#f5e9d3;
  --fg-dim:#b8a98f;
  --accent:#e9c27b;
  --line:rgba(245,233,211,.26);
  --serif:"Bodoni 72","Didot","Baskerville","Georgia","Songti SC","Noto Serif CJK SC","Times New Roman",serif;
  --ui:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--bg-0);color:var(--fg);font:15px/1.5 var(--ui);overflow:hidden;-webkit-text-size-adjust:100%}
#stage{position:relative;width:100%;height:100%;overflow:hidden;background:radial-gradient(ellipse 80% 55% at 50% 47%,var(--bg-1) 0%,var(--bg-0) 74%);touch-action:none;cursor:grab;-webkit-user-select:none;user-select:none}
#stage.drag{cursor:grabbing}
#stage canvas{display:block;width:100%;height:100%}
.love{position:absolute;left:0;right:0;top:0;padding:28px 16px 0;text-align:center;pointer-events:none}
.love .to{margin:0;font-family:var(--serif);font-size:.8rem;letter-spacing:.28em;text-transform:uppercase;color:var(--fg-dim)}
.love h1{margin:6px 0 0;font-family:var(--serif);font-style:italic;font-weight:400;font-size:clamp(2.3rem,10vw,3.8rem);line-height:1.1;color:var(--fg);text-wrap:balance}
.bar{position:absolute;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;gap:10px;padding:0 16px 18px;pointer-events:none}
.bar p{margin:0;font-size:.78rem;letter-spacing:.1em;color:var(--fg-dim)}
.metals{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;pointer-events:auto}
.metals button{min-height:44px;min-width:64px;padding:0 16px;border:1px solid var(--line);border-radius:999px;background:rgba(9,10,17,.55);color:var(--fg);font:inherit;font-size:.85rem;letter-spacing:.12em;cursor:pointer}
.metals button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.metals button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.fail{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;color:var(--fg-dim)}
</style>

<div id="stage">
  <header class="love">
    <p class="to">To 贝贝, with all my love</p>
    <h1>Marry me.</h1>
  </header>
  <div class="bar">
    <p>拖动旋转 · 双指缩放</p>
    <div class="metals" role="group" aria-label="戒指的金属">
      <button type="button" data-m="gold" aria-pressed="true">金色</button>
      <button type="button" data-m="rose" aria-pressed="false">玫瑰金</button>
      <button type="button" data-m="plat" aria-pressed="false">铂金</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.min.js"></script>
<script>
(function () {
  'use strict';
  var stage = document.getElementById('stage');
  var reduce = false;
  try { reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}

  function fail(msg) {
    var d = document.createElement('div');
    d.className = 'fail';
    d.textContent = msg;
    stage.appendChild(d);
  }
  if (!window.THREE) { fail('3D 组件没有加载出来。请确认网络能访问境外资源，然后刷新页面。'); return; }

  var renderer;
  try {
    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  } catch (e) { fail('这个浏览器打不开 3D 画面。'); return; }
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.1;
  renderer.domElement.setAttribute('role', 'img');
  renderer.domElement.setAttribute('aria-label', '可以旋转查看的 3D 钻戒');
  stage.insertBefore(renderer.domElement, stage.firstChild);

  /* ---------- helpers ---------- */
  var TAU = Math.PI * 2;
  function clamp(x, a, b) { return Math.min(b, Math.max(a, x)); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function sgnpow(x, p) { return (x < 0 ? -1 : 1) * Math.pow(Math.abs(x), p); }
  function rng(seed) {
    return function () {
      seed |= 0; seed = seed + 0x6D2B79F5 | 0;
      var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  /* ---------- scene ---------- */
  var scene = new THREE.Scene();
  var camera = new THREE.PerspectiveCamera(34, 1, 0.1, 60);
  var root = new THREE.Group();          // turned by the viewer
  scene.add(root);
  var ring = new THREE.Group();          // lifted so the whole ring is centred on the turning point
  ring.position.y = -0.25;
  root.add(ring);

  /* A studio made of light panels. Metal and facets only look like metal and diamond when they have something bright to reflect. */
  function buildEnv() {
    var es = new THREE.Scene();
    es.background = new THREE.Color(0x14151d);
    var r = rng(21);
    function panel(w, h, x, y, z, hex, k) {
      var m = new THREE.Mesh(
        new THREE.PlaneGeometry(w, h),
        new THREE.MeshBasicMaterial({ color: new THREE.Color(hex).multiplyScalar(k), side: THREE.DoubleSide })
      );
      m.position.set(x, y, z);
      m.lookAt(0, 0, 0);
      es.add(m);
    }
    panel(16, 16, 0, 16, 2, 0xfff3e2, 2.6);     // top softbox
    panel(3, 18, -14, 3, 10, 0xffe6c8, 6);      // warm strip, front left
    panel(3, 18, 14, 2, 9, 0xd8e8ff, 6);        // cool strip, front right
    panel(22, 4, 0, 2, -16, 0xffffff, 4);       // back rim
    panel(18, 18, 0, -16, 0, 0xffd8c0, 0.7);    // warm bounce from below
    panel(14, 5, -16, -2, -6, 0xffd9b0, 2.2);
    panel(14, 5, 16, -1, -7, 0xc9dcff, 2.2);
    var spots = [0xffffff, 0xfff0d0, 0xd8ecff, 0xffe0ee];
    for (var i = 0; i < 16; i++) {          // small hot points: these become the glints in the facets
      var a = r() * TAU, e = (r() - 0.3) * 1.9, rad = 15;
      panel(0.9, 0.9, Math.cos(a) * Math.cos(e) * rad, Math.sin(e) * rad, Math.sin(a) * Math.cos(e) * rad, spots[i % 4], 28);
    }
    var pm = new THREE.PMREMGenerator(renderer);
    var rt = pm.fromScene(es, 0.02, 0.1, 100);
    pm.dispose();
    return rt.texture;
  }
  try {
    scene.environment = buildEnv();
  } catch (e) {
    scene.add(new THREE.HemisphereLight(0xffffff, 0x302030, 1.0));
    var k1 = new THREE.DirectionalLight(0xfff1e0, 2.2); k1.position.set(3, 5, 4); scene.add(k1);
    var k2 = new THREE.DirectionalLight(0xcfe0ff, 1.6); k2.position.set(-4, 2, -3); scene.add(k2);
  }

  /* ---------- materials ---------- */
  var METALS = {
    gold: { c: 0xeab85c, r: 0.2 },
    rose: { c: 0xe6a08e, r: 0.2 },
    plat: { c: 0xe4e6ea, r: 0.12 }
  };
  var bandMat = new THREE.MeshStandardMaterial({ color: METALS.gold.c, metalness: 1, roughness: METALS.gold.r, envMapIntensity: 1.25 });
  var diaMat = new THREE.MeshPhysicalMaterial({
    vertexColors: true, color: 0xffffff, metalness: 1, roughness: 0.02, envMapIntensity: 1.6,
    iridescence: 0.55, iridescenceIOR: 1.8, iridescenceThicknessRange: [120, 420],
    side: THREE.DoubleSide
  });

  /* ---------- the diamond: a round brilliant, cut facet by facet ---------- */
  function diamondGeometry() {
    var R = 1, rt = 0.56, rs = 0.74, rl = 0.62;
    var yg = 0, ygb = -0.05, yt = 0.30, yc = -0.83;
    var c22 = Math.cos(Math.PI / 8);
    var ys = yt - (rs * c22 - rt) / (R - rt) * (yt - yg);   // keeps each bezel facet flat
    var yl = yc + (ygb - yc) * (rl * c22);                    // keeps each pavilion facet flat
    var pos = [], col = [];
    var tints = [[1, 1, 1], [0.88, 0.93, 1], [1, 0.92, 0.95], [1, 0.96, 0.88]];
    var tr = rng(3);
    function tint() { return tints[Math.floor(tr() * 4)]; }
    function V(r, a, y) { return [r * Math.cos(a), y, r * Math.sin(a)]; }
    function tri(a, b, c, t) {
      [a, b, c].forEach(function (p) { pos.push(p[0], p[1], p[2]); col.push(t[0], t[1], t[2]); });
    }
    function quad(a, b, c, d, t) { tri(a, b, c, t); tri(a, c, d, t); }

    var T = [], S = [], L = [], G = [], Gb = [], k, i;
    for (k = 0; k < 8; k++) {
      T.push(V(rt, k * Math.PI / 4, yt));
      S.push(V(rs, k * Math.PI / 4 + Math.PI / 8, ys));
      L.push(V(rl, k * Math.PI / 4 + Math.PI / 8, yl));
    }
    for (i = 0; i < 16; i++) {
      G.push(V(R, i * Math.PI / 8, yg));
      Gb.push(V(R, i * Math.PI / 8, ygb));
    }
    var C = [0, yc, 0], TC = [0, yt, 0], white = [1, 1, 1];
    for (k = 0; k < 8; k++) {
      var k1 = (k + 1) % 8, km = (k + 7) % 8;
      tri(TC, T[k], T[k1], white);                                   // table
      tri(T[k], S[k], T[k1], tint());                                // star facet
      quad(T[k], S[k], G[2 * k], S[km], tint());                     // bezel facet
      tri(S[k], G[2 * k], G[2 * k + 1], tint());                     // upper girdle facets
      tri(S[k], G[2 * k + 1], G[(2 * k + 2) % 16], tint());
      quad(Gb[2 * k], L[k], C, L[km], tint());                       // pavilion main facet
      tri(L[k], Gb[2 * k], Gb[2 * k + 1], tint());                   // lower girdle facets
      tri(L[k], Gb[2 * k + 1], Gb[(2 * k + 2) % 16], tint());
    }
    for (i = 0; i < 16; i++) {
      var i1 = (i + 1) % 16;
      quad(G[i], G[i1], Gb[i1], Gb[i], white);                       // girdle band
    }
    var g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
    g.computeVertexNormals();                                        // unshared vertices, so every facet is flat
    return g;
  }
  var diaGeo = diamondGeometry();

  /* ---------- the band: thicker and wider under the stone, slimmer behind the finger ---------- */
  var RR = 1.0;
  function profile(th) {
    var w = Math.pow(0.5 + 0.5 * Math.cos(th), 2.2);
    return { tr: 0.05 + 0.055 * w, tw: 0.085 + 0.06 * w };
  }
  function bandGeometry(NU, NV) {
    var pos = [], idx = [], i, j;
    for (i = 0; i < NU; i++) {
      var th = i / NU * TAU, pr = profile(th);
      for (j = 0; j < NV; j++) {
        var ph = j / NV * TAU;
        var rad = RR + pr.tr * sgnpow(Math.cos(ph), 0.7);
        pos.push(rad * Math.sin(th), rad * Math.cos(th), pr.tw * sgnpow(Math.sin(ph), 0.7));
      }
    }
    for (i = 0; i < NU; i++) {
      for (j = 0; j < NV; j++) {
        var a = i * NV + j, b = i * NV + (j + 1) % NV;
        var c = ((i + 1) % NU) * NV + j, d = ((i + 1) % NU) * NV + (j + 1) % NV;
        idx.push(a, c, b, b, c, d);
      }
    }
    var g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    g.setIndex(idx);
    g.computeVertexNormals();
    return g;
  }
  ring.add(new THREE.Mesh(bandGeometry(180, 32), bandMat));

  /* ---------- centre stone and four prongs ---------- */
  var diaGroup = new THREE.Group();
  diaGroup.position.set(0, 1.405, 0);
  diaGroup.scale.setScalar(0.42);
  diaGroup.rotation.y = Math.PI / 8;
  diaGroup.add(new THREE.Mesh(diaGeo, diaMat));
  ring.add(diaGroup);

  var prongPath = [[0.08, 1.08], [0.20, 1.16], [0.31, 1.27], [0.44, 1.38], [0.455, 1.43], [0.395, 1.475]];
  for (var pk = 0; pk < 4; pk++) {
    var al = Math.PI / 4 + pk * Math.PI / 2, dx = Math.cos(al), dz = Math.sin(al);
    var pts = prongPath.map(function (p) { return new THREE.Vector3(dx * p[0], p[1], dz * p[0]); });
    ring.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 28, 0.03, 8, false), bandMat));
    var bead = new THREE.Mesh(new THREE.SphereGeometry(0.048, 14, 10), bandMat);
    bead.position.copy(pts[pts.length - 1]);
    bead.scale.set(1, 0.8, 1);
    ring.add(bead);
  }

  /* ---------- small stones set into both shoulders ---------- */
  [-1, 1].forEach(function (sd) {
    for (var n = 0; n < 7; n++) {
      var th = sd * (0.20 + n * 0.115);
      var radius = RR + profile(th).tr * 0.92;
      var st = new THREE.Mesh(diaGeo, diaMat);
      st.position.set(Math.sin(th) * radius, Math.cos(th) * radius, 0);
      st.rotation.z = -th;
      st.scale.setScalar(0.075 - n * 0.0045);
      ring.add(st);
    }
  });

  /* ---------- sparkle flares and gold motes ---------- */
  function softTexture(rays) {
    var c = document.createElement('canvas');
    c.width = c.height = 128;
    var g = c.getContext('2d');
    var gr = g.createRadialGradient(64, 64, 0, 64, 64, 64);
    gr.addColorStop(0, 'rgba(255,255,255,1)');
    gr.addColorStop(0.12, 'rgba(255,248,232,0.9)');
    gr.addColorStop(0.4, 'rgba(255,238,205,0.16)');
    gr.addColorStop(1, 'rgba(255,238,205,0)');
    g.fillStyle = gr;
    g.fillRect(0, 0, 128, 128);
    if (rays) {
      var h = g.createLinearGradient(0, 0, 128, 0);
      h.addColorStop(0, 'rgba(255,255,255,0)'); h.addColorStop(0.5, 'rgba(255,255,255,0.95)'); h.addColorStop(1, 'rgba(255,255,255,0)');
      g.fillStyle = h; g.fillRect(0, 62, 128, 4);
      var v = g.createLinearGradient(0, 0, 0, 128);
      v.addColorStop(0, 'rgba(255,255,255,0)'); v.addColorStop(0.5, 'rgba(255,255,255,0.95)'); v.addColorStop(1, 'rgba(255,255,255,0)');
      g.fillStyle = v; g.fillRect(62, 0, 4, 128);
    }
    var tex = new THREE.CanvasTexture(c);
    tex.colorSpace = THREE.SRGBColorSpace;
    return tex;
  }
  var starTex = softTexture(true), dotTex = softTexture(false);
  var flares = [];
  [[-0.13, 0.17, 0.45, 1.7, 0.0], [0.20, 0.04, 0.45, 1.1, 2.1], [0.03, -0.12, 0.5, 2.3, 4.2]].forEach(function (f) {
    var sp = new THREE.Sprite(new THREE.SpriteMaterial({
      map: starTex, color: 0xfff1d6, blending: THREE.AdditiveBlending,
      transparent: true, depthWrite: false, depthTest: false
    }));
    scene.add(sp);
    flares.push({ sp: sp, o: f.slice(0, 3), f: f[3], ph: f[4] });
  });

  var DUST = 70, dustPos = new Float32Array(DUST * 3), dustSpd = new Float32Array(DUST);
  var dr = rng(5);
  for (var q = 0; q < DUST; q++) {
    dustPos[q * 3] = (dr() - 0.5) * 6;
    dustPos[q * 3 + 1] = (dr() - 0.5) * 5;
    dustPos[q * 3 + 2] = (dr() - 0.5) * 3 - 1;
    dustSpd[q] = 0.03 + dr() * 0.06;
  }
  var dustGeo = new THREE.BufferGeometry();
  dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPos, 3));
  scene.add(new THREE.Points(dustGeo, new THREE.PointsMaterial({
    map: dotTex, color: 0xf2cf93, size: 0.12, transparent: true, opacity: 0.55,
    depthWrite: false, blending: THREE.AdditiveBlending
  })));

  /* ---------- metal choice ---------- */
  var metalBtns = document.querySelectorAll('.metals button');
  metalBtns.forEach(function (btn) {
    btn.addEventListener('click', function () {
      var m = METALS[btn.getAttribute('data-m')];
      if (!m) return;
      bandMat.color.set(m.c);
      bandMat.roughness = m.r;
      metalBtns.forEach(function (b) { b.setAttribute('aria-pressed', b === btn ? 'true' : 'false'); });
    });
  });

  /* ---------- turning and zooming ---------- */
  var INTRO = 2.8, introT = reduce ? INTRO : 0;
  var yaw = reduce ? 0.55 : -1.35, pitch = 0.2, vyaw = 0, zoom = 1, idle = 0, dragging = false, dist = 6;
  var pts2 = new Map(), lastPinch = 0;
  function pinchDist() {
    var a = Array.from(pts2.values());
    return a.length < 2 ? 0 : Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y);
  }
  stage.addEventListener('pointerdown', function (e) {
    if (e.target.closest && e.target.closest('button')) return;
    try { stage.setPointerCapture(e.pointerId); } catch (err) {}
    pts2.set(e.pointerId, { x: e.clientX, y: e.clientY });
    dragging = true; idle = 0; vyaw = 0; introT = INTRO;
    stage.classList.add('drag');
    if (pts2.size === 2) lastPinch = pinchDist();
  });
  stage.addEventListener('pointermove', function (e) {
    var p = pts2.get(e.pointerId);
    if (!p) return;
    var dx = e.clientX - p.x, dy = e.clientY - p.y;
    p.x = e.clientX; p.y = e.clientY;
    if (pts2.size === 1) {
      yaw += dx * 0.0085;
      pitch = clamp(pitch + dy * 0.006, -0.5, 1.1);
      vyaw = dx * 0.0085;
    } else if (pts2.size === 2) {
      var d = pinchDist();
      if (lastPinch > 0 && d > 0) zoom = clamp(zoom * (lastPinch / d), 0.55, 1.8);
      lastPinch = d;
    }
    idle = 0;
  });
  function endPointer(e) {
    pts2.delete(e.pointerId);
    if (pts2.size < 2) lastPinch = 0;
    if (pts2.size === 0) { dragging = false; stage.classList.remove('drag'); }
  }
  stage.addEventListener('pointerup', endPointer);
  stage.addEventListener('pointercancel', endPointer);
  stage.addEventListener('lostpointercapture', endPointer);
  stage.addEventListener('wheel', function (e) {
    e.preventDefault();
    zoom = clamp(zoom * (1 + e.deltaY * 0.0012), 0.55, 1.8);
    idle = 0;
  }, { passive: false });

  /* ---------- size and loop ---------- */
  function resize() {
    var w = stage.clientWidth, h = stage.clientHeight;
    if (!w || !h) return;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    var th = Math.tan(camera.fov * Math.PI / 360);
    dist = Math.max(1.75 / th, 1.4 / (th * camera.aspect));   // fit the ring's width and the stone's height
  }
  if (window.ResizeObserver) new ResizeObserver(resize).observe(stage);
  window.addEventListener('resize', resize);
  resize();

  function easeOut(x) { return 1 - Math.pow(1 - x, 3); }
  var clock = new THREE.Clock(), time = 0, flashT = 0, wp = new THREE.Vector3();
  function frame() {
    requestAnimationFrame(frame);
    var dt = Math.min(clock.getDelta(), 0.05);
    time += dt;
    if (introT < INTRO) {
      introT += dt;
      yaw = lerp(-1.35, 0.55, easeOut(clamp(introT / INTRO, 0, 1)));
      idle = 0;
    } else if (!dragging) {
      yaw += vyaw; vyaw *= 0.94;
      idle += dt;
      if (idle > 2.5 && !reduce) yaw += 0.3 * dt;
    }
    if (!reduce) {
      for (var i = 0; i < DUST; i++) {
        var y = dustPos[i * 3 + 1] + dustSpd[i] * dt;
        dustPos[i * 3 + 1] = y > 2.5 ? -2.5 : y;
      }
      dustGeo.attributes.position.needsUpdate = true;
    }
    root.rotation.x = pitch;
    root.rotation.y = yaw;
    camera.position.set(0, 0, dist * zoom);
    camera.lookAt(0, 0, 0);

    diaGroup.getWorldPosition(wp);
    var flash = 0;
    if (!reduce && introT >= INTRO) {
      flashT += dt;                                   // one bright burst of glints when the ring settles
      flash = clamp(1 - flashT / 1.6, 0, 1);
    }
    for (var f = 0; f < flares.length; f++) {
      var fl = flares[f];
      var pulse = reduce ? 0.5 : Math.pow(Math.max(0, Math.sin(time * fl.f + fl.ph)), 7);
      pulse = Math.max(pulse, flash);
      fl.sp.position.set(wp.x + fl.o[0], wp.y + fl.o[1], wp.z + fl.o[2]);
      var size = 0.12 + 0.55 * pulse;
      fl.sp.scale.set(size, size, 1);
      fl.sp.material.opacity = pulse;
    }
    renderer.render(scene, camera);
  }
  frame();
})();
</script>

</html>
